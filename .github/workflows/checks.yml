name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Relative links and heading anchors resolve
        run: python3 scripts/check_links.py
      - name: Generated reference pages are up to date
        run: |
          python3 scripts/build_reference.py
          git diff --exit-code reference/glossary.md reference/papers.md \
            || { echo "::error::Run python3 scripts/build_reference.py and commit the result"; exit 1; }
