name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Relative links and heading anchors resolve
        run: python3 scripts/check_links.py
      - name: Generated reference pages are up to date
        run: |
          python3 scripts/build_reference.py
          git diff --exit-code reference/glossary.md reference/papers.md \
            || { echo "::error::Run python3 scripts/build_reference.py and commit the result"; exit 1; }

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-site.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements-site.txt
      - name: Let Chrome use its sandbox on Ubuntu runners (for PDF export)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build site and decks (strict; same formats as the Pages deploy)
        run: python3 scripts/build_site.py --pdf --pptx
